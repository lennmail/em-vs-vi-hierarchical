[project]
name = "emvi"
version = "1.0.0"
description = "EM vs. variational inference for Bayesian hierarchical models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pymc>=5",
    "matplotlib",
    "seaborn",
    "pandas",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["pymc.*", "scipy.*", "pandas.*", "seaborn.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is handled by ruff-format
